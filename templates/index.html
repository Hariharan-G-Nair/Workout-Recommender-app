<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Workout Recommender</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:
            linear-gradient(
                135deg,
                #0f172a,
                #111827,
                #1e293b
            );

            overflow:hidden;
        }

        .container{

            width:420px;

            padding:40px;

            border-radius:20px;

            background:rgba(255,255,255,0.08);

            backdrop-filter:blur(15px);

            border:1px solid rgba(255,255,255,0.15);

            box-shadow:
            0 8px 32px rgba(0,0,0,0.35);

            text-align:center;

            color:white;
        }

        h1{

            font-size:32px;

            margin-bottom:10px;

            font-weight:700;

            color:#00ffb3;
        }

        .subtitle{

            color:#cbd5e1;

            margin-bottom:35px;

            font-size:15px;

            line-height:1.6;
        }

        input{

            width:100%;

            padding:15px;

            border:none;

            border-radius:12px;

            outline:none;

            background:#1e293b;

            color:white;

            font-size:15px;

            margin-bottom:25px;

            transition:0.3s;
        }

        input::placeholder{

            color:#94a3b8;
        }

        input:focus{

            border:1px solid #00ffb3;

            box-shadow:
            0 0 15px rgba(0,255,179,0.3);
        }

        button{

            width:100%;

            padding:15px;

            border:none;

            border-radius:12px;

            background:
            linear-gradient(
                135deg,
                #00ffb3,
                #00c896
            );

            color:#0f172a;

            font-size:16px;

            font-weight:600;

            cursor:pointer;

            transition:0.3s ease;
        }

        button:hover{

            transform:translateY(-3px);

            box-shadow:
            0 10px 20px rgba(0,255,179,0.25);
        }

        .footer{

            margin-top:25px;

            color:#94a3b8;

            font-size:13px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>
            Workout AI
        </h1>

        <p class="subtitle">

            Discover personalized workout recommendations
            powered by NLP and machine learning.

        </p>

        <form action="/predict" method="POST">

            <input
                type="text"
                name="workout"
                list="workout-list"
                placeholder="Search workouts..."
                autocomplete="off"
                required
            >

            <datalist id="workout-list">

                {% for workout in workouts %}

                <option value="{{ workout }}">

                {% endfor %}

            </datalist>

            <button type="submit">

                Get Recommendations

            </button>

        </form>

        <div class="footer">

            Built using Flask + NLP

        </div>

    </div>

</body>

</html>
